<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDG Pomodoro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
    />

    <link rel="stylesheet" href="./styles/pomodoro.css" />
  <!--<script>alert("This might be a illegal script. Are you sure you want to continue?");</script>-->
  </head>
  <body>
    <div class="gdg-decor-bg" aria-hidden="true">
      <span class="bracket">&lt;</span>
      <span class="bracket">&gt;</span>
    </div>

    <header class="page-header">
      <div class="logo-container">
        <span class="gdg-logo-text">
          <span class="blue">G</span><span class="red">D</span
          ><span class="yellow">G</span> <span class="green">Timer</span>
        </span>
      </div>
    </header>

    <main class="layout">
      <section class="panel glass-effect">
        <header class="panel-header">
          <nav class="mode-switch">
            <button id="focus-btn" class="mode-chip active" data-mode="focus"> Focus </button>
            <button id="short-break-btn" class="mode-chip" data-mode="short-break" > Short Break </button>
            <button id="long-break-btn" class="mode-chip" data-mode="long-break" > Long Break </button>
          </nav>
        </header>

        <div class="timer-container">
          <svg
            class="timer-ring"
            width="300"
            height="300"
            viewBox="0 0 300 300"
          >
            <circle class="ring-track" cx="150" cy="150" r="135"></circle>
            <circle
              class="ring-progress"
              id="ring-progress"
              cx="150"
              cy="150"
              r="135"
              pathLength="1"
            ></circle>
          </svg>
          <div class="timer-display" id="timer-display">25:00</div>
          <p class="timer-label" id="timer-label">Time to focus</p>
        </div>

        <div class="controls">

          <div class="task-control">
              <button class="btn-to-add" id="add-btn" aria-label="Add Task">
                  <span class="material-symbols-rounded" id="add-icon">add</span> 
                  <span class="btn-hover-text">Add Task</span>
              </button>
          </div>

          <button class="btn-icon secondary" id="reset-btn" aria-label="Reset Timer" >
            <span class="material-symbols-rounded">restart_alt</span>
          </button>

          <button class="btn-fab primary" id="toggle-btn" aria-label="Start Timer" >
            <span class="material-symbols-rounded" id="toggle-icon" >play_arrow</span > 
          </button>

          <div class="iteration-badge" title="Completed Sessions">
            <span class="material-symbols-rounded">check_circle</span>
            <span id="iteration-count">0</span>
          </div>


        </div>
      </section> 

      <section id="task-manager">
        <!-- hidden by default, and will be shown when the add task button is clicked -->
        <h3 id="task-count">Tasks: 0</h3>
        <div id="task-list" class="hidden">
          <form id="task-form">
              <input
                type="text"
                id="task-input"
                placeholder="Enter your task"
                required 
                maxlength="50"
              />
              <button type="submit" id="submit-task-btn">Save Task</button>
          </form>

            <ul id="tasks-ul">
              <!-- tasks will be dynamically added here -->
            </ul>
        </div>
      </section>

    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
